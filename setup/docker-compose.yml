services:
  mongodb:
    container_name: "mongo-angles"
    hostname: mongodb
    image: mongo:5.0.32
    restart: always
    volumes:
      - angles_mongo_db:/data/db
      - angles_mongo_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=@nglesPassword
      - MONGO_INITDB_DATABASE=angles
    command:
      - --auth
      - --bind_ip_all

  backend:
    container_name: "angles"
    image: angleshq/angles:latest
    restart: always
    ports:
      - 3000:3000
    environment:
      - ANGLES_API_BASE_URL=http://localhost:3000
      - ANGLES_API_BASE_PATH=/rest/api/v1.0
      - SWAGGER_SCHEMES=http
      - PORT=3000
      - BUILD_CLEAN_UP_AGE_IN_DAYS=90
      - MONGO_URL=mongodb://angleshq:%40nglesPassword@mongodb:27017/angles
      # Public origin of this instance. Each SSO provider's redirect/callback URL is
      # derived from it, and must match what is registered with the identity provider,
      # so set this to the URL users actually reach Angles on.
      - ANGLES_BASE_URL=${ANGLES_BASE_URL:-http://localhost:3000}
      # Signs session cookies. Required when NODE_ENV=production; anyone who knows it can
      # forge a session for any account, so generate a random value per deployment.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Initial admin account is seeded on first startup from this password.
      # Set via the deployment environment; change before deploying.
      - ANGLES_ADMIN_PASSWORD=${ANGLES_ADMIN_PASSWORD:-ChangeMe!1}
    depends_on:
      - mongodb
    volumes:
      - angles_screenshots:/app/screenshots
      - angles_screenshot_compares:/app/compares

  frontend:
    container_name: "angles-ui"
    image: angleshq/angles-ui:latest
    restart: always
    ports:
      - 3001:3001
    environment:
      - ANGLES_API_BASE_URL=http://localhost:3000
      - ANGLES_API_BASE_PATH=/rest/api/v1.0
      - PORT=3001
    depends_on:
      - backend

volumes:
  angles_mongo_db:
    name: angles_mongo_db
  angles_mongo_config:
    name: angles_mongo_config
  angles_screenshots:
    name: angles_screenshots
  angles_screenshot_compares:
    name: angels_screenshot_compares
